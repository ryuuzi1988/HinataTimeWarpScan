<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パーフェクトひなた</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* =========================================
       ここで色を一括管理します（CSS変数）
       ========================================= */
    :root {
      --main-color: #ff8c00;
      /* 文字のメイン色（オレンジ） */
      --btn-color: #dd0505;
      /* ボタンの色（赤） */
      --shadow-color: #950202;
      /* ボタンの影の色（濃い赤） */
      --bg-color: #fefdfd;
      /* 背景色 */
      --panel-bg-color: rgba(255, 255, 255, 0.8); /* 操作ブロックの背景色（白・少し透ける） */
      --toast-bg: #ffb703;
      /* 通知の背景色（黄色） */
      --toast-text: #000000;
      /* 通知の文字色 */

      /* スライダーの色設定（黒） */
      --slider-color: #333333;

      /* プレビュー画面の枠線の設定 */
      --canvas-border-color: #333333;
      --canvas-border-width: 3px;

      /* 背景アイコンの設定 */
      --bg-icon-size: 200px;
      --bg-icon-opacity: 0.45;
      --bg-icon-rotate: 0deg;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-color);
      color: var(--main-color);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      position: relative;
      z-index: 0;
    }

    /* 背景にfaviconを斜めに散りばめる設定 */
    body::before {
      content: "";
      position: fixed;
      top: -20vh;
      left: -20vw;
      width: 140vw;
      height: 140vh;
      background-image: url('favicon.png');
      background-size: var(--bg-icon-size);
      background-repeat: repeat;
      opacity: var(--bg-icon-opacity);
      transform: rotate(var(--bg-icon-rotate));
      z-index: -1;
      pointer-events: none;
    }

    video {
      position: absolute;
      width: 0;
      height: 0;
      visibility: hidden;
    }

    /* 操作系をまとめるブロック（背景色をつけて見やすくする） */
    .ui-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--panel-bg-color);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
      width: 100%;
      max-width: 640px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    canvas {
      border: var(--canvas-border-width) solid var(--canvas-border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 640px;
      height: auto;
      background: #000;
      position: relative;
      z-index: 1;
    }

    .controls {
      margin: 8px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: var(--btn-color);
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 4px 0 var(--shadow-color);
      transition: all 0.1s;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--shadow-color);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    /* スライダー（レンジ入力）の色を黒に変更 */
    input[type="range"] {
      accent-color: var(--slider-color);
    }

    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: var(--toast-bg);
      color: var(--toast-text);
      text-align: center;
      border-radius: 30px;
      padding: 12px 20px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
  </style>
</head>

<body>
  <!-- 操作系をまとめるブロック -->
  <div class="ui-container">
    <h2>ひなた せんよう エフェクト</h2>

    <div class="controls slider-container">
      <label for="speedSlider">はやさ:</label>
      <input type="range" id="speedSlider" min="1" max="10" value="3">
      <span id="speedValue">3</span>
    </div>

    <div class="controls">
      <button id="startHorizontalBtn">よこにスキャン</button>
      <button id="startVerticalBtn">たてにスキャン</button>
      <button id="saveBtn">ほぞん</button>
    </div>
  </div>

  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="toast">ほぞんしたよ！</div>

  <script>
    // =========================================
    // ここで設定を一括管理します
    // =========================================
    const CONFIG = {
      scanLineColor: '#00e5ff', // スキャン線の色（青）
      scanLineWidth: 3          // スキャン線の太さ（px）
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    const startHBtn = document.getElementById('startHorizontalBtn');
    const startVBtn = document.getElementById('startVerticalBtn');
    const saveBtn = document.getElementById('saveBtn');

    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    const toast = document.getElementById('toast');

    let scanPos = 0;
    let isScanning = false;
    let scanDirection = 'horizontal';
    let speed = parseInt(speedSlider.value, 10);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    })
      .then(stream => {
        video.srcObject = stream;

        video.addEventListener('loadedmetadata', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          offCanvas.width = video.videoWidth;
          offCanvas.height = video.videoHeight;
          video.play();
        });
      })
      .catch(err => {
        alert("カメラの起動に失敗しました。\n理由: " + err.name + "\nメッセージ: " + err.message);
      });

    speedSlider.addEventListener('input', (e) => {
      speed = parseInt(e.target.value, 10);
      speedValue.textContent = speed;
    });

    startHBtn.addEventListener('click', () => {
      scanDirection = 'horizontal';
      scanPos = 0;
      isScanning = true;
    });

    startVBtn.addEventListener('click', () => {
      scanDirection = 'vertical';
      scanPos = 0;
      isScanning = true;
    });

    saveBtn.addEventListener('click', () => {
      const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const filename = `timewarp_${Date.now()}.jpg`;

      if (isIOS) {
        canvas.toBlob((blob) => {
          const file = new File([blob], filename, { type: 'image/jpeg' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
              files: [file],
              title: 'エフェクト画像'
            }).then(() => {
              showToast("ほぞんしたよ！");
            }).catch((err) => { });
          }
        }, 'image/jpeg', 0.9);
      } else {
        const link = document.createElement('a');
        link.download = filename;
        link.href = jpegDataUrl;
        link.click();
        showToast("ほぞんしたよ！");
      }
    });

    function draw() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {

        offCtx.save();
        offCtx.translate(offCanvas.width, 0);
        offCtx.scale(-1, 1);
        offCtx.drawImage(video, 0, 0, offCanvas.width, offCanvas.height);
        offCtx.restore();

        const src = offCanvas;

        if (isScanning) {
          if (scanDirection === 'horizontal') {
            ctx.drawImage(src, scanPos, 0, speed, canvas.height, scanPos, 0, speed, canvas.height);

            const nextPos = scanPos + speed;
            const remaining = canvas.width - nextPos;

            if (remaining > 0) {
              ctx.drawImage(src, nextPos, 0, remaining, canvas.height, nextPos, 0, remaining, canvas.height);
            }

            if (nextPos < canvas.width) {
              ctx.fillStyle = CONFIG.scanLineColor;
              ctx.fillRect(nextPos, 0, CONFIG.scanLineWidth, canvas.height);
              scanPos = nextPos;
            } else {
              isScanning = false;
            }
          } else {
            ctx.drawImage(src, 0, scanPos, canvas.width, speed, 0, scanPos, canvas.width, speed);

            const nextPos = scanPos + speed;
            const remaining = canvas.height - nextPos;

            if (remaining > 0) {
              ctx.drawImage(src, 0, nextPos, canvas.width, remaining, 0, nextPos, canvas.width, remaining);
            }

            if (nextPos < canvas.height) {
              ctx.fillStyle = CONFIG.scanLineColor;
              ctx.fillRect(0, nextPos, canvas.width, CONFIG.scanLineWidth);
              scanPos = nextPos;
            } else {
              isScanning = false;
            }
          }
        } else if (scanPos === 0) {
          ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>

</html>
